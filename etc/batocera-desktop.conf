# /etc/batocera-desktop.conf  (se ejecuta como root: debe ser de root y no escribible por otros)

# Copia de la partición BATOCERA: debe contener boot/batocera (+ boot/rufomaculata)
BD_BOOT_DIR=/var/batocera
# Se verá como /userdata dentro de Batocera (roms, bios, saves, system/batocera.conf)
BD_USERDATA=/batocera

# Montajes extra "origen:destino[:ro]" separados por espacios. Ej.: tu disco de roms
#BD_EXTRA_BINDS="/pcgrande:/pcgrande"

# GPU: auto | nvidia | mesa   (nvidia = usa las librerías del driver del HOST)
BD_GPU=auto
# Audio: host = usa el PipeWire de tu sesión | none
BD_AUDIO=host
# Bluetooth: host = comparte el bluetoothd del host (D-Bus) | exclusive (experimental) | off
BD_BT=host
# "Apagar" dentro de ES: exit = cierra Batocera y vuelve al escritorio | host = apaga el PC
BD_ON_SHUTDOWN=exit

# Servicios de /etc/init.d de Batocera que se arrancan (en orden)
#BD_SERVICES="S12populateshare S50triggerhappy S97joycond S31emulationstation S99userservices"

# Teclado para el labwc anidado (vacío = el de /etc/default/keyboard del host)
#BD_XKB_LAYOUT=es

# Renderer de wlroots: gles2 (estable) | vulkan
#BD_WLR_RENDERER=gles2
# 1 = usa también libnvidia-egl-* del host en vez de las de Batocera (si falla EGL/Wayland)
#BD_NVIDIA_HOST_EGL_PLATFORM=0
# Namespace de PIDs privado (recomendado: Batocera usa killall/pidof)
#BD_PIDNS=1

# Tamaño por defecto de la ventana de Batocera (labwc anidado)
#BD_RESOLUTION=1920x1080

# Modo drm (arrancado desde una consola /dev/ttyN, sin Wayland): GPU(s) que usa labwc.
# Útil en portátiles híbridos. Vacío = lo decide el labwc-launch de Batocera.
#BD_DRM_DEVICES=/dev/dri/card1

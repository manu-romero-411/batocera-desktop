# /etc/batocera-desktop.conf  (executed as root: must be owned by root and not writable by others)

# Which Batocera build runs here (checked against the hardware at install AND at every start):
#   v3          current x86-64-v3 build, Wayland/labwc; CPU with AVX2 & co. (nested window or tty)
#   x86_64      current standard build, X11; any amd64 without Intel GMA / Atom N4xx-N5xx-N2xxx (tty only)
#   5.26-amd64  Batocera 5.26 amd64, X11; Intel GMA / Atom netbook machines (tty only)
#   5.26-i386   Batocera 5.26 i386, X11; 32-bit-only CPUs (tty only)
# `batocera-desktop detect` shows which ones fit this machine.
BD_VARIANT=v3
# Download sources for the 5.26 builds (a boot.tar.xz URL); empty = use --file / --img at install
#BD_URL_526_AMD64=
#BD_URL_526_I386=

# Copy of the BATOCERA partition: must contain boot/batocera (+ boot/rufomaculata)
BD_BOOT_DIR=/var/batocera
# Seen as /userdata inside Batocera (roms, bios, saves, system/batocera.conf)
BD_USERDATA=/batocera

# Extra bind mounts "src:dst[:ro]", space separated. E.g. a separate games disk:
#BD_EXTRA_BINDS="/games:/games"

# GPU: auto | nvidia | mesa   (nvidia = use the HOST driver's userspace libraries)
BD_GPU=auto
# X11 variants on a machine with several GPUs: pin Xorg to one ("PCI:bus:dev:func", see `lspci`; hex ->
# decimal, e.g. 01:00.0 = PCI:1:0:0) and, if it is not NVIDIA, its Xorg driver (default modesetting).
# NVIDIA is picked automatically when its kernel module is loaded; BD_GPU=mesa to use the Intel/AMD GPU instead.
#BD_X11_BUSID=PCI:0:2:0
#BD_X11_DRIVER=modesetting
# Audio: host = use your session's PipeWire | none
BD_AUDIO=host
# PulseAudio (not PipeWire) only lets another uid in with its auth cookie, and everything inside Batocera is
# root: the desktop user's ~/.config/pulse/cookie (or ~/.pulse-cookie) is handed to it automatically.
# Only set this if your cookie lives elsewhere (XDG_CONFIG_HOME, PULSE_COOKIE). Not needed with PipeWire.
#BD_PULSE_COOKIE=/home/you/.config/pulse/cookie
# Bluetooth: host = share the host's bluetoothd over D-Bus | exclusive (experimental) | off
BD_BT=host
# Can Batocera power off / reboot the HOST? (true | false)
#   false  "Shutdown" in ES closes Batocera and returns to where it was started; "Restart" restarts
#          the Batocera session (applies pending updates). The host is never touched.
#   true   shutdown / poweroff / halt / reboot run inside Batocera (ES menu, power key, SSH, scripts)
#          are passed to the host (`systemctl poweroff|reboot`): the machine really shuts down or
#          reboots. For setups where Batocera is the front end of a server with no UI of its own
#          (with the service enabled it comes back by itself after a reboot and applies pending updates).
BD_CAN_SHUTDOWN=false

# Batocera init.d services started (in order)
# S90hotkeygen is Batocera's hotkey service (pad hotkey+X combos, volume/brightness keys): without it
# the gamepad hotkey does nothing inside games. A different number (S30hotkeygen) is found by itself.
#BD_SERVICES="S12populateshare S50triggerhappy S97joycond S31emulationstation S90hotkeygen S99userservices"

# Keyboard for the nested labwc (empty = host's /etc/default/keyboard)
#BD_XKB_LAYOUT=us

# wlroots renderer: gles2 (stable) | vulkan
#BD_WLR_RENDERER=gles2
# 1 = also use the host's libnvidia-egl-* instead of Batocera's (if EGL-on-Wayland fails)
#BD_NVIDIA_HOST_EGL_PLATFORM=0
# Private PID namespace (recommended: Batocera uses killall/pidof)
#BD_PIDNS=1

# ---------------------------------------------------------------- display
# nested (manual start inside Wayland): ask the host compositor (KDE, sway, Hyprland) to make
# the Batocera window fullscreen (auto | 1 | 0)
#BD_FULLSCREEN=auto
# Default size of the nested window when it is not fullscreen
#BD_RESOLUTION=1920x1080
# drm mode: GPU(s) labwc uses (hybrid laptops). Empty = Batocera decides.
#BD_DRM_DEVICES=/dev/dri/card1

# ------------------------------------------------- systemd service (drm, no desktop)
# The service takes the first FREE console from this VT up and switches to it
# (tty1-6 are text consoles, tty7 is usually X11/lightdm, so the default is 8).
#BD_TTY_MIN=8
# Desktop user whose PipeWire provides the audio. Empty = the lowest regular user that is
# logged in (has /run/user/UID), else uid 1000. Started on demand when nobody is logged in.
#BD_USER=youruser

# ------------------------------------------------------------- audio and keys
# Copy the host's audio device/profile/volume into batocera.conf when the session starts.
# Changes made inside Batocera always act on the host (same PipeWire).
#BD_AUDIO_SYNC=1
# Key daemon inside Batocera: auto (drm mode only: in a window your desktop handles the keys)
# | 1 | 0
#BD_TRIGGERHAPPY=auto
# Add volume up/down/mute keys to triggerhappy's key map (and the step in percent).
# auto = only when hotkeygen is not started (hotkeygen already handles those keys: two handlers = double step)
#BD_VOLUME_KEYS=auto
#BD_VOLUME_STEP=5
# drm mode: Batocera's key daemons see the keyboard even while your desktop is on another VT, so
# pressing volume keys there would change the (shared) volume twice. 1 = Batocera ignores its
# volume keys unless its own VT is the active one. 0 = always act.
#BD_VOLUME_GATE=1
